spring.application.name=b2b-marketplace
server.port=8080

# --- Base de datos---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:25432/marketplace_b2b}
spring.datasource.username=${DB_USER:marketplace}
spring.datasource.password=${DB_PASSWORD:marketplace}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Seguridad JWT ---
app.security.jwt.secret=${JWT_SECRET:M8QzToeO4nTDR7Qa/P8WjS2+IvcRvwvju5DxbONWfIb6rXpC8VRJFahwqyrsOR7B}
app.security.jwt.issuer=b2b-marketplace
app.security.jwt.expiration=PT1H


# --- Actuator ---
management.endpoints.web.exposure.include=health,info


# --- Logging ---
logging.level.root=INFO
logging.level.com.marketplace.b2b=DEBUG
logging.pattern.correlation=[%X{correlationId:-}] 

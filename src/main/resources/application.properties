spring.application.name=b2b-marketplace
server.port=8080

# --- Base de datos (sobrescribible por variables de entorno en Docker) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:25432/marketplace_b2b}
spring.datasource.username=${DB_USER:marketplace}
spring.datasource.password=${DB_PASSWORD:marketplace}

# --- JPA: el esquema lo controla Flyway -------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
# db/migration = esquema (siempre). db/demo = datos de demostración
# En producción: FLYWAY_LOCATIONS=classpath:db/migration
spring.flyway.enabled=true
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}

# --- Paginación: evita que un cliente pida páginas gigantes ---
spring.data.web.pageable.max-page-size=100

# --- Seguridad JWT ---
# en Docker/producción se inyecta con la variable de entorno JWT_SECRET.
app.security.jwt.secret=${JWT_SECRET:M8QzToeO4nTDR7Qa/P8WjS2+IvcRvwvju5DxbONWfIb6rXpC8VRJFahwqyrsOR7B}
app.security.jwt.issuer=b2b-marketplace
app.security.jwt.expiration=PT1H

# --- Pasarela de pago (simulada) ---
# Probabilidad (0.0 a 1.0) de que cada intento falle con un error transitorio
app.payment.gateway.failure-rate=${PAYMENT_FAILURE_RATE:0.3}
app.payment.gateway.max-attempts=3
app.payment.gateway.initial-backoff=PT0.2S
app.payment.gateway.backoff-multiplier=2.0

# --- Integración ERP / CRM (patrón outbox) ---
app.integration.outbox.poll-interval=PT5S
app.integration.outbox.batch-size=20
app.integration.outbox.max-attempts=8
app.integration.outbox.initial-backoff=PT10S
app.integration.outbox.max-backoff=PT10M
# Simulación de los sistemas externos 
app.integration.erp.available=true
app.integration.erp.latency=${ERP_LATENCY:PT1S}
app.integration.crm.available=true
app.integration.crm.latency=PT0.2S

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- Logging ---
logging.level.root=INFO
logging.level.com.marketplace.b2b=DEBUG
logging.pattern.correlation=[%X{correlationId:-}]
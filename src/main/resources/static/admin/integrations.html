<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Integraciones (admin) · B2B Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav id="app-navbar"></nav>

<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
    <div>
      <h1 class="page-title h3 mb-0"><i class="bi bi-plug me-2"></i>Integraciones ERP / CRM</h1>
      <p class="small text-muted mb-0">Eventos del patrón outbox · se actualiza cada 5 segundos</p>
    </div>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="auto-refresh" checked>
      <label class="form-check-label small" for="auto-refresh">Actualización automática</label>
    </div>
  </div>

  <div id="integrations-alert"></div>

  <div class="row g-3 mb-3" id="status-tiles"></div>

  <div class="card">
    <div class="card-header bg-white">
      <ul class="nav nav-tabs card-header-tabs" id="event-tabs">
        <li class="nav-item"><button class="nav-link active" data-status="PENDING">Pendientes</button></li>
        <li class="nav-item"><button class="nav-link" data-status="FAILED">Fallidos</button></li>
        <li class="nav-item"><button class="nav-link" data-status="PROCESSED">Procesados</button></li>
      </ul>
    </div>
    <div id="events-content" class="card-body p-0"></div>
  </div>
</main>

<footer class="app-footer text-center py-3">B2B Marketplace · MVP</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/admin/integrations.js"></script>
</body>
</html>

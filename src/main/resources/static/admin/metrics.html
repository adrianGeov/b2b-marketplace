<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Métricas · B2B Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav id="app-navbar"></nav>

<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
    <div>
      <h1 class="page-title h3 mb-0"><i class="bi bi-graph-up me-2"></i>Métricas del negocio</h1>
      <p class="text-muted mb-0 small" id="period-label">&nbsp;</p>
    </div>
    <form id="range-form" class="d-flex flex-wrap align-items-end gap-2">
      <div>
        <label for="from" class="form-label small text-muted mb-1">Desde</label>
        <input type="date" id="from" class="form-control form-control-sm" required>
      </div>
      <div>
        <label for="to" class="form-label small text-muted mb-1">Hasta</label>
        <input type="date" id="to" class="form-control form-control-sm" required>
      </div>
      <button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-arrow-repeat me-1"></i>Actualizar</button>
      <div class="btn-group btn-group-sm" role="group" aria-label="Periodos rápidos">
        <button type="button" class="btn btn-outline-secondary" data-days="30">30 días</button>
        <button type="button" class="btn btn-outline-secondary" data-days="90">90 días</button>
        <button type="button" class="btn btn-outline-secondary" data-days="365">1 año</button>
      </div>
    </form>
  </div>

  <div id="metrics-alert"></div>

  <div id="metrics-content">
    <div class="text-center py-5"><span class="spinner-border text-primary" aria-label="Cargando"></span></div>
  </div>
</main>

<footer class="app-footer text-center py-3">B2B Marketplace · MVP</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/admin/metrics.js"></script>
</body>
</html>

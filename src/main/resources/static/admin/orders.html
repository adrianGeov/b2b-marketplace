<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedidos (admin) · B2B Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav id="app-navbar"></nav>

<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
    <h1 class="page-title h3 mb-0"><i class="bi bi-truck me-2"></i>Pedidos de todos los clientes</h1>
    <div>
      <label for="status-filter" class="form-label small text-muted mb-1">Estatus</label>
      <select id="status-filter" class="form-select form-select-sm">
        <option value="">Todos</option>
      </select>
    </div>
  </div>

  <div class="alert alert-light border small">
    <i class="bi bi-info-circle me-1"></i>Solo se puede <strong>enviar</strong> un pedido confirmado por el ERP,
    y solo se puede <strong>entregar</strong> un pedido enviado.
  </div>

  <div id="orders-alert"></div>
  <div id="orders-content">
    <div class="text-center py-5"><span class="spinner-border text-primary" aria-label="Cargando"></span></div>
  </div>

  <nav class="mt-3" aria-label="Paginación de pedidos">
    <ul id="pagination" class="pagination justify-content-center mb-0"></ul>
  </nav>
</main>

<footer class="app-footer text-center py-3">B2B Marketplace · MVP</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/admin/orders.js"></script>
</body>
</html>

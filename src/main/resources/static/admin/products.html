<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos (admin) · B2B Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav id="app-navbar"></nav>

<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
    <h1 class="page-title h3 mb-0"><i class="bi bi-box-seam me-2"></i>Productos</h1>
    <button id="new-product" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nuevo producto</button>
  </div>

  <div class="card card-body mb-3">
    <div class="row g-2 align-items-center">
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="search" id="search" class="form-control" placeholder="Nombre, SKU o descripción" maxlength="100">
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="include-inactive" checked>
          <label class="form-check-label" for="include-inactive">Incluir productos inactivos</label>
        </div>
      </div>
    </div>
  </div>

  <div id="products-alert"></div>
  <div id="products-content">
    <div class="text-center py-5"><span class="spinner-border text-primary" aria-label="Cargando"></span></div>
  </div>

  <nav class="mt-3" aria-label="Paginación de productos">
    <ul id="pagination" class="pagination justify-content-center mb-0"></ul>
  </nav>
</main>

<!-- Modal de alta / edición -->
<div class="modal fade" id="product-modal" tabindex="-1" aria-labelledby="product-modal-title" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <form class="modal-content" id="product-form" novalidate>
      <div class="modal-header">
        <h2 class="modal-title h5" id="product-modal-title">Nuevo producto</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div id="form-alert"></div>
        <div class="row g-3">
          <div class="col-md-4">
            <label for="sku" class="form-label">SKU</label>
            <input type="text" class="form-control text-uppercase" id="sku" name="sku" maxlength="40"
                   pattern="[A-Za-z0-9\-]+" required>
            <div class="invalid-feedback">Solo letras, números y guiones.</div>
          </div>
          <div class="col-md-8">
            <label for="name" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="name" name="name" maxlength="150" required>
            <div class="invalid-feedback">El nombre es obligatorio.</div>
          </div>
          <div class="col-12">
            <label for="description" class="form-label">Descripción</label>
            <textarea class="form-control" id="description" name="description" rows="2" maxlength="1000"></textarea>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-4">
            <label for="category" class="form-label">Categoría</label>
            <input type="text" class="form-control" id="category" name="category" list="category-list" maxlength="80" required>
            <datalist id="category-list"></datalist>
            <div class="invalid-feedback">La categoría es obligatoria.</div>
          </div>
          <div class="col-md-4">
            <label for="price" class="form-label">Precio (MXN)</label>
            <input type="number" class="form-control" id="price" name="price" min="0.01" step="0.01" required>
            <div class="invalid-feedback">Precio mayor a 0.</div>
          </div>
          <div class="col-md-4">
            <label for="stock" class="form-label">Existencias</label>
            <input type="number" class="form-control" id="stock" name="stock" min="0" step="1" required>
            <div class="invalid-feedback">No puede ser negativo.</div>
          </div>
          <div class="col-12">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="active" name="active" checked>
              <label class="form-check-label" for="active">Activo (visible para los clientes)</label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="save-btn"><i class="bi bi-save me-1"></i>Guardar</button>
      </div>
    </form>
  </div>
</div>

<footer class="app-footer text-center py-3">B2B Marketplace · MVP</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/admin/products.js"></script>
</body>
</html>

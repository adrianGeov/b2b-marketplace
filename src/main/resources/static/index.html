<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio · B2B Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav id="app-navbar"></nav>

<main class="container py-4">
  <div id="home-alert"></div>

  <div class="card">
    <div class="card-body p-4">
      <h1 class="page-title h3 mb-1">Hola, <span id="welcome-name"></span></h1>
      <p class="text-muted mb-3">
        <i class="bi bi-building me-1"></i><span id="welcome-company"></span>
        · <span class="badge text-bg-light" id="welcome-role"></span>
      </p>
      <p class="mb-0" id="api-status">
        <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Verificando conexión con la API...
      </p>
    </div>
  </div>

  <p class="text-muted small mt-3">
    <i class="bi bi-info-circle me-1"></i>En el siguiente paso esta página se convierte en el catálogo de productos.
  </p>
</main>

<footer class="app-footer text-center py-3">B2B Marketplace · MVP</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/home.js"></script>
</body>
</html>

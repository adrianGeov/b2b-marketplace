<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo · B2B Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav id="app-navbar"></nav>

<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
    <div>
      <h1 class="page-title h3 mb-0">Catálogo de productos</h1>
      <p class="text-muted mb-0" id="result-count">&nbsp;</p>
    </div>
  </div>

  <!-- Filtros -->
  <form id="filters" class="card card-body mb-4" role="search">
    <div class="row g-2 align-items-end">
      <div class="col-md-5">
        <label for="search" class="form-label small text-muted mb-1">Buscar</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="search" id="search" class="form-control" maxlength="100"
                 placeholder="Nombre, SKU o descripción">
        </div>
      </div>
      <div class="col-md-3">
        <label for="category" class="form-label small text-muted mb-1">Categoría</label>
        <select id="category" class="form-select">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="sort" class="form-label small text-muted mb-1">Ordenar por</label>
        <select id="sort" class="form-select">
          <option value="name,asc">Nombre (A-Z)</option>
          <option value="price,asc">Precio: menor a mayor</option>
          <option value="price,desc">Precio: mayor a menor</option>
          <option value="stock,desc">Más disponibles</option>
        </select>
      </div>
      <div class="col-md-1 d-grid">
        <button type="button" id="clear-filters" class="btn btn-outline-secondary" title="Limpiar filtros">
          <i class="bi bi-x-lg"></i><span class="d-md-none ms-1">Limpiar filtros</span>
        </button>
      </div>
    </div>
  </form>

  <div id="catalog-alert"></div>

  <div id="product-grid" class="row g-3"></div>

  <nav class="mt-4" aria-label="Paginación del catálogo">
    <ul id="pagination" class="pagination justify-content-center mb-0"></ul>
  </nav>
</main>

<footer class="app-footer text-center py-3">B2B Marketplace · MVP</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/catalog.js"></script>
</body>
</html>

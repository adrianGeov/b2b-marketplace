<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · B2B Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<main class="auth-wrapper">
  <div class="card auth-card">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="auth-brand fs-3"><i class="bi bi-boxes me-2"></i>B2B Marketplace</div>
        <p class="text-muted mb-0">Portal de pedidos para distribuidores y clientes autorizados</p>
      </div>

      <div id="login-alert"></div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <div class="input-group has-validation">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" name="email" autocomplete="username" required>
            <div class="invalid-feedback">Ingrese un correo válido.</div>
          </div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group has-validation">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" required>
            <div class="invalid-feedback">La contraseña es obligatoria.</div>
          </div>
        </div>
        <button type="submit" id="login-btn" class="btn btn-primary w-100 py-2">
          <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
        </button>
      </form>

      <p class="text-center mt-4 mb-0">
        ¿Aún no tiene cuenta? <a href="/register.html">Regístrese aquí</a>
      </p>

      <hr class="my-4">
      <div class="small text-muted text-center mb-2">Cuentas de demostración</div>
      <div class="d-flex gap-2 justify-content-center flex-wrap">
        <button type="button" class="btn btn-sm btn-outline-secondary"
                data-demo-email="admin@marketplace.com" data-demo-password="Admin123!">
          <i class="bi bi-shield-lock me-1"></i>Administrador
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary"
                data-demo-email="norte@demo.mx" data-demo-password="Demo1234">
          <i class="bi bi-shop me-1"></i>Distribuidor demo
        </button>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/login.js"></script>
</body>
</html>
